services:
  kleinanzeigen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kleinanzeigen-api
    ports:
      # Host 8001: 8000 is already taken on the deployment box.
      - "8001:8000"
    restart: unless-stopped
    # Run under tini so orphaned Chromium children are reaped. Without an init,
    # PID 1 is uvicorn, which never wait()s on them, so every browser recycle
    # (see utils/browser.py) would leave zombie entries behind forever.
    init: true
    environment:
      - PYTHONUNBUFFERED=1
      - API_TOKEN=${API_TOKEN}
    env_file:
      - .env
    volumes:
      # Optional: Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    healthcheck:
      # Use Python (always present) instead of curl, which isn't in the slim image
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
